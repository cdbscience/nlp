
services:
  app:
    build: .
    image: djangonlp
    command: ["sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"]
    volumes:
      - .:/app
    networks:
      - ghost_ghost_network
    env_file:
      - .env
    ports:
      - "8000:8000"

networks:
  ghost_ghost_network:
    external: true